name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Testes com pytest
        run: pytest --cov=app --cov-report=term-missing

      - name: Resultado
        if: always()
        run: |
          echo "### Resultado da CI" >> "$GITHUB_STEP_SUMMARY"
          echo "Status do job: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
