name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  CONTAINER_NAME: devops-python-api

jobs:
  test:
    name: 1. Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing

  build-and-push:
    name: 2. Build e push no ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir nome da imagem (tag = SHA do commit)
        id: meta
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" \
                       -t "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest" .
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest"

  deploy:
    name: 3. Deploy na EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Preparar chave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keygen -y -f ~/.ssh/ec2_key.pem > /dev/null
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Atualizar contêiner na EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            bash -s -- "${{ needs.build-and-push.outputs.image }}" "${{ secrets.AWS_REGION }}" "${{ env.CONTAINER_NAME }}" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"; REGION="$2"; NAME="$3"
          REGISTRY="${IMAGE%%/*}"

          echo ">> Login do Docker no ECR (via IAM Role da instância)"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"

          echo ">> Baixando $IMAGE"
          docker pull "$IMAGE"

          echo ">> Substituindo contêiner anterior"
          docker rm -f "$NAME" 2>/dev/null || true
          docker run -d --name "$NAME" --restart unless-stopped -p 80:8000 "$IMAGE"

          echo ">> Verificando execução"
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS http://localhost/health; then ok=1; break; fi
            sleep 2
          done
          echo
          docker ps --filter "name=$NAME"
          if [ "$ok" != 1 ]; then docker logs "$NAME"; exit 1; fi
          docker image prune -f >/dev/null
          REMOTE

      - name: Resumo
        run: echo "Deploy concluído. Imagem ${{ needs.build-and-push.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
